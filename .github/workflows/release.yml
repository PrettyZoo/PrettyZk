name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libxdo-dev libfuse2 \
            squashfs-tools xdg-utils file

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'webapp/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install root CLI
        run: npm ci

      - name: Prepare UI + self-contained backend payload
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/prepare-desktop.mjs

      - name: Smoke test backend (JRE + jars + /api/health)
        run: node scripts/smoke-backend.mjs

      - name: Assert staged payload
        shell: bash
        run: |
          set -e
          ls build/desktop/app/lib/*.jar >/dev/null
          test -f webapp/dist/index.html
          test -f webapp/dist/splash.html
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f build/desktop/runtime/bin/java.exe
          else
            test -x build/desktop/runtime/bin/java
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            lipo -info build/desktop/runtime/bin/java
          fi

      - name: Stage VC++ runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' `
            -OutFile 'build/desktop/vc_redist.x64.exe'

      - name: Build installer
        env:
          # linuxdeploy itself is an AppImage; run it without FUSE on runners.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # linuxdeploy's bundled strip is too old for modern ELF (.relr.dyn).
          NO_STRIP: 1
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --verbose --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} 2>&1 | tee build-installer.log

      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          if [ -f build-installer.log ]; then
            relevant=$(grep -iE 'error|fail|linuxdeploy|strip|fuse|mksquashfs|gdk-pixbuf|appimage|cannot|not found' build-installer.log || true)
            if [ -z "$relevant" ]; then
              relevant=$(tail -n 10 build-installer.log)
            fi
            printf '%s\n' "$relevant" | tail -n 10 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prettyzk-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

  release:
    name: Publish draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
