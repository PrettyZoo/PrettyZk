plugins {
    id 'checkstyle'
}

group 'com.dujie'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url 'https://maven.aliyun.com/nexus/content/groups/public/'
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'idea'
    apply plugin: 'checkstyle'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    group 'com.dujie'
    version '3.0.0'

    checkstyle {
        toolVersion = '14.4.0'
        ignoreFailures = false
        maxWarnings = 0
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    ext {
        slf4jVersion = '2.0.6'
        jacksonVersion = '2.18.0'
        log4jVersion = '2.24.0'
        junitVersion = '4.13.2'
        zookeeperVersion = '3.6.4'
        curatorRecipesVersion = '5.4.0'
        guavaVersion = '31.1-jre'
        sshjVersion = '0.34.0'
        javalinVersion = '6.4.0'
        lombokVersion = '1.18.48'
    }

    dependencies {
        implementation group: 'org.slf4j', name: 'slf4j-api', version: "${slf4jVersion}"
        implementation "org.apache.logging.log4j:log4j-api:${log4jVersion}"
        implementation "org.apache.logging.log4j:log4j-core:${log4jVersion}"
        implementation "org.apache.logging.log4j:log4j-slf4j2-impl:${log4jVersion}"
        testImplementation group: 'junit', name: 'junit', version: "${junitVersion}"

        constraints {
            implementation group: 'com.hierynomus', name: 'sshj', version: "${sshjVersion}"
            implementation "com.google.guava:guava:${guavaVersion}"
            implementation "io.javalin:javalin:${javalinVersion}"
            implementation('org.slf4j:slf4j-api:2.0.6') {
                force = true
            }
            api("org.apache.zookeeper:zookeeper:${zookeeperVersion}") {
                force = true
            }
            implementation "org.apache.curator:curator-recipes:${curatorRecipesVersion}"
            implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: "${jacksonVersion}"
            implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: "${jacksonVersion}"
            implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: "${jacksonVersion}"
            implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jdk8', version: "${jacksonVersion}"

            compileOnly "org.projectlombok:lombok:${lombokVersion}"
            annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        }
    }
}
