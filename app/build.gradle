plugins {
    id 'idea'
    id 'application'
}

checkstyleMain.source = "src/main/java"

application {
    mainClass = "com.dujie.app.Application"
    applicationDefaultJvmArgs = ["-Dfile.encoding=utf-8"]
}

run {
    jvmArgs = ["-Dfile.encoding=utf-8"]
}

processResources {
    doFirst {
        if (!file('../webapp/dist/index.html').exists()) {
            throw new GradleException(
                    'webapp/dist is missing. Run: cd webapp && npm install && npm run build')
        }
    }
    from('../webapp/dist') {
        into 'web'
    }
}

dependencies {
    api project(':core')
    api project(':model')

    implementation 'io.javalin:javalin'
}

// ---------------------------------------------------------------------------
// Self-contained desktop payload
//   :app:jlinkRuntime -> build/jlink-runtime (JRE for this OS/arch)
//   :app:stageDesktop -> <repo>/build/desktop/{runtime,app/lib}
// Tauri's bundle.resources copies that directory into the installer.
// ---------------------------------------------------------------------------

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def javaHome = System.getProperty('java.home')
def jlinkBinary = file("${javaHome}/bin/jlink${isWindows ? '.exe' : ''}")
// Derived from: jdeps --print-module-deps --ignore-missing-deps
// plus the service-provider modules jdeps cannot see (crypto, zipfs, charsets).
def jlinkModules = [
        'java.base', 'java.desktop', 'java.instrument', 'java.logging',
        'java.management', 'java.naming', 'java.net.http', 'java.security.jgss',
        'java.security.sasl', 'java.sql', 'java.xml',
        'jdk.crypto.ec', 'jdk.unsupported',
        'jdk.zipfs'
].join(',')

tasks.register('jlinkRuntime', Exec) {
    group = 'desktop'
    description = 'Create a minimal JRE for the current platform and architecture'
    def outputDir = layout.buildDirectory.dir('jlink-runtime')
    outputs.dir(outputDir)
    doFirst {
        if (!jlinkBinary.exists()) {
            throw new GradleException("jlink not found at ${jlinkBinary}")
        }
        delete outputDir
    }
    def jlinkArgs = [jlinkBinary.absolutePath]
    // JDK 25+ no longer ships jmods (JEP 493); jlink links from the runtime image.
    def jmods = file("${javaHome}/jmods")
    if (jmods.exists()) {
        jlinkArgs += ['--module-path', jmods.absolutePath]
    }
    jlinkArgs += [
            '--add-modules', jlinkModules,
            '--strip-debug', '--no-header-files', '--no-man-pages', '--compress=zip-6',
            '--output', outputDir.get().asFile.absolutePath
    ]
    commandLine jlinkArgs
    doLast {
        delete outputDir.get().asFile.toPath().resolve('legal').toFile()
    }
}

tasks.register('stageDesktop', Sync) {
    group = 'desktop'
    description = 'Stage the JRE and backend jars for the Tauri bundler'
    dependsOn tasks.named('installDist'), tasks.named('jlinkRuntime')
    into rootProject.layout.buildDirectory.dir('desktop')
    from(layout.buildDirectory.dir('jlink-runtime')) {
        into 'runtime'
        exclude 'legal/**'
    }
    from(layout.buildDirectory.dir('install/app/lib')) {
        into 'app/lib'
    }
}
