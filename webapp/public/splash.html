<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrettyZk</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f7f9;
      color: #1b1d23;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    .wrap { text-align: center; max-width: 560px; padding: 32px; }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 14px; background: #0f9d8a; color: #fff;
      font-weight: 700; font-size: 20px; letter-spacing: -0.5px;
    }
    h1 { margin: 0 0 6px; font-size: 20px; font-weight: 650; }
    #status { margin: 0; color: #6b7280; font-size: 13px; }
    #error {
      display: none; margin: 18px 0 0; padding: 12px 14px;
      text-align: left; white-space: pre-wrap; word-break: break-word;
      background: #fff; border: 1px solid #e3e5ea; border-radius: 8px;
      color: #b42318; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; line-height: 1.5; max-height: 220px; overflow: auto;
    }
    .spinner {
      width: 16px; height: 16px; margin: 18px auto 0;
      border: 2px solid #d7dae0; border-top-color: #0f9d8a;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      body { background: #15171c; color: #e6e8ee; }
      #status { color: #9aa1ae; }
      #error { background: #1c1f26; border-color: #2a2e37; color: #ff9b8f; }
      .spinner { border-color: #2a2e37; border-top-color: #4fd1c5; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">PZ</div>
    <h1>PrettyZk</h1>
    <p id="status">正在启动本地服务…</p>
    <div class="spinner" id="spinner"></div>
    <pre id="error"></pre>
  </div>
  <script>
    // Called from Rust when the Java backend cannot be started.
    window.showStartupError = function (message) {
      var status = document.getElementById('status');
      var error = document.getElementById('error');
      var spinner = document.getElementById('spinner');
      if (status) status.textContent = '启动失败';
      if (spinner) spinner.style.display = 'none';
      if (error) {
        error.textContent = message;
        error.style.display = 'block';
      }
    };
  </script>
</body>
</html>
